[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[project]
name = "pnd-teleop"
version = "0.8.0"
description = "pnd teleoperation ros2 python virtual environment"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "catkin-pkg>=1.1.0",
    "fastapi>=0.128.0",
    "huggingface-hub>=0.27.0",
    "loop-rate-limiters>=1.2.0",
    "mink>=1.1.0",
    "pydantic>=2.12.4",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "typer>=0.15.0",
    "uvicorn>=0.40.0",
    "websockets>=15.0.1",
]

[project.scripts]
pteleop = "scripts.cli.pteleop:app"

[dependency-groups]
dev = [
    "ament-lint>=0.14.2",
    "lark>=1.3.1",
    "pytest>=9.0.1",
    "ruff>=0.15.9",
]

[tool.ruff]
line-length = 100
extend-exclude = [".venv", "build", "install", "log", "src/driver/pteleop_bridge/thirdparty/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.pydocstyle]
convention = "google"